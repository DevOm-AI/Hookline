x-app: &app
  build: .
  image: hookline:dev
  env_file: .env
  volumes:
    - ./app:/app/app
    # Mounted so `alembic revision` run in a container writes into the repo.
    - ./alembic:/app/alembic
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  # Runs once and exits; nothing else starts until the schema is up to date.
  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    ports:
      - "8000:8000"
    # The slim image has no curl; urlopen raises (exit 1) on the 503 from /health.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info
    # docker stop sends SIGTERM: Celery finishes the requests in flight and takes no new ones.
    # The default 10s before SIGKILL can cut a send short (connect, write and read each get
    # 10s). Wait as long as the delivery lock; past that the sweeper hands it on anyway.
    stop_grace_period: 60s

  # Run exactly one beat, or scheduled jobs fire twice.
  beat:
    <<: *app
    command: >-
      celery -A app.workers.celery_app:celery_app beat --loglevel=info
      --schedule /tmp/celerybeat-schedule

  # A test tool, not part of Hookline: the webhook receiver for load and chaos tests.
  # Only started when asked for: docker compose up -d receiver
  receiver:
    image: hookline:dev
    build: .
    profiles: [receiver]
    command: uvicorn receiver.main:app --host 0.0.0.0 --port 9000
    environment:
      RECEIVER_SECRET: ${RECEIVER_SECRET:-}
      RECEIVER_FAIL_PERCENT: ${RECEIVER_FAIL_PERCENT:-0}
      RECEIVER_DELAY_MS: ${RECEIVER_DELAY_MS:-0}
    volumes:
      - ./receiver:/app/receiver
    # Loopback only: the control routes (/config, /received) have no auth. Other containers
    # on the compose network, the workers among them, still reach it as receiver:9000.
    ports:
      - "127.0.0.1:${RECEIVER_HOST_PORT:-9000}:9000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hookline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hookline}
      POSTGRES_DB: ${POSTGRES_DB:-hookline}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # No persistence: Redis only wakes workers up, Postgres holds every delivery.
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:

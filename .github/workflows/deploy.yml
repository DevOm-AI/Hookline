name: Deploy

# Deploys main to the VM once CI has passed on it. See docs/deploy.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One deploy at a time; a newer one waits instead of cutting an older one off mid-build.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Secrets can't be read in a job's `if`, so this job checks for them and says so.
  check:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
    steps:
      - id: secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DEPLOY_HOST, DEPLOY_USER or DEPLOY_SSH_KEY is not set; skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    # Only a CI run for a push to this repository's main: a fork's pull request from a branch
    # also named main triggers this workflow too.
    if: >-
      needs.check.outputs.configured == 'true'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Optional: the VM's `ssh-keyscan` output, checked out of band. Without it the host
          # key is trusted on first sight, on every run.
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi

      # Deploys the commit CI tested, not whatever main is by now: a newer push gets its own
      # CI run and deploy. Older commits are already contained, so --ff-only leaves them be.
      - name: Pull and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$SHA" <<'EOF'
          set -euo pipefail
          cd ~/hookline
          git fetch --quiet origin main
          git merge --ff-only "$1"
          docker compose -f docker-compose.prod.yml up -d --build --wait
          docker image prune -f
          EOF
